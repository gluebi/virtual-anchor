name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Both the npm provenance attestation and — since this package has a trusted publisher
      # configured — the credential the publish authenticates with. There is no npm token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+. changesets publishes through pnpm here, but
      # pnpm's publish path still leans on the npm CLI underneath — the auth error from the
      # tokenless run was in npm's voice — so this makes the requirement hold either way.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      # Never publish something the suite has not passed. The release job repeats the gate
      # rather than trusting that CI ran on the same commit.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm check:package

      - name: Version or publish
        uses: changesets/action@v1
        with:
          # With changesets pending, this opens a "Version Packages" PR. Merging that PR runs
          # this workflow again with none pending, and then it publishes.
          version: pnpm changeset version
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token: the package has a trusted publisher, so authentication is the OIDC
          # token minted by `id-token: write` above. Nothing long-lived exists to leak, and
          # provenance comes with it.
          NPM_CONFIG_PROVENANCE: 'true'
