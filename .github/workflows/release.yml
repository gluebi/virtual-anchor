name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Both the npm provenance attestation and — since this package has a trusted publisher
      # configured — the credential the publish authenticates with. There is no npm token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+. changesets publishes through pnpm here, but
      # pnpm's publish path still leans on the npm CLI underneath — the auth error from the
      # tokenless run was in npm's voice — so this makes the requirement hold either way.
      #
      # Pinned to 11 rather than `latest`, which is npm 12 as of 2026-08-29, and npm 12 breaks
      # `changeset publish` outright. `pnpm info` is not a pnpm command at all on pnpm 10 — it is
      # passed through to whatever `npm` is on PATH — and npm 12 wraps `npm view --json` in an
      # array. Changesets unwraps that in its npm code path and not in its pnpm one, so
      # `response.info.versions` is undefined and `getUnpublishedPackages` dies on
      # `Cannot read properties of undefined (reading 'includes')`. That is
      # changesets/changesets#2274, open and unreleased; the pin comes off when it ships.
      #
      # This is why the failure never reproduced locally: npm 11.6.2 here returns a bare object.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile

      # Never publish something the suite has not passed. The release job repeats the gate
      # rather than trusting that CI ran on the same commit.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm check:package

      - name: Version or publish
        id: publish
        uses: changesets/action@v2
        with:
          # With changesets pending, this opens a "Version Packages" PR. Merging that PR runs
          # this workflow again with none pending, and then it publishes.
          #
          # Every one of these was renamed in v2 — `version`, `publish`, `commit` and `title`
          # became `version-script`, `publish-script`, `commit-message` and `pr-title`. The old
          # spellings are not ignored, they fail the step outright, so the bump from v1 stopped
          # 0.9.0 between its version commit and its publish: `main` carried the new version and
          # changelog while npm still served 0.8.1.
          version-script: pnpm changeset version
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          # No `GITHUB_TOKEN` here any more. v2 stopped reading it from the environment — a
          # custom token has to go through the `github-token` input — and that input already
          # defaults to this workflow's own token, which is the one this repo wants. Left in
          # place it would only suggest it was doing something.
          #
          # No npm token either: the package has a trusted publisher, so authentication is the
          # OIDC token minted by `id-token: write` above. Nothing long-lived exists to leak,
          # and provenance comes with it.
          NPM_CONFIG_PROVENANCE: 'true'

      # The release reports success from the publisher's own account of itself, and that is not
      # the same as the package being fetchable. So ask the registry.
      #
      # Cache-busted, and this is the whole difficulty: npm's CDN served a stale 404 for a
      # version whose own `time` entry says it was live two minutes after the publish, and went
      # on doing so for a quarter of an hour. A verification without the query param fails on
      # that rather than on anything real — which is worse than no verification, because the
      # release it fails has already happened and cannot be retried.
      #
      # Only when something was actually published: with changesets pending this workflow opens
      # a Version PR instead, and there is nothing to look for.
      - name: Verify the publish reached the registry
        if: steps.publish.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          set -euo pipefail
          jq -r '.[] | [.name, .version] | @tsv' <<< "$PUBLISHED" > /tmp/published.tsv
          test -s /tmp/published.tsv || {
            echo "::error::published=true but published-packages named nothing"
            exit 1
          }
          failed=0
          # `while … done < file` runs in this shell, so `failed` survives the loop. Through a
          # pipe it would not, and the step would pass while reporting that it had not.
          while IFS=$'\t' read -r name version; do
            path="${name//\//%2f}/${version}"
            for attempt in $(seq 1 30); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' \
                "https://registry.npmjs.org/${path}?cachebust=${GITHUB_RUN_ID}-${attempt}" || echo 000)
              if [ "$code" = "200" ]; then
                echo "$name@$version is on the registry"
                break
              fi
              if [ "$attempt" = "30" ]; then
                echo "::error::$name@$version was reported published, but the registry answers $code"
                failed=1
              fi
              sleep 10
            done
          done < /tmp/published.tsv
          exit "$failed"
