name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm provenance: a verifiable link from the published tarball back to this commit and
      # this workflow. It cannot be added to a version after the fact, which is why it is here
      # before the first publish rather than after.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Never publish something the suite has not passed. The release job repeats the gate
      # rather than trusting that CI ran on the same commit.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm check:package

      - name: Version or publish
        uses: changesets/action@v1
        with:
          # With changesets pending, this opens a "Version Packages" PR. Merging that PR runs
          # this workflow again with none pending, and then it publishes.
          version: pnpm changeset version
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
